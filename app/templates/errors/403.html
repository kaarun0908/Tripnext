{% extends "base.html" %}

{% block title %}403 Forbidden — TripNest{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-shield-lock-fill text-danger" style="font-size: 5rem;"></i>
        <h1 class="display-5 fw-bold mt-3 mb-2">403 — Access Denied</h1>
        <p class="lead text-muted mb-4">You do not have administrative clearance or permission to access this resource.</p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary-teal">Return to Homepage</a>
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary">Sign In with Another Account</a>
        </div>
    </div>
</div>
{% endblock %}
