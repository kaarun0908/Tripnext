{% extends "base.html" %}

{% block title %}500 Server Error — TripNest{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 5rem;"></i>
        <h1 class="display-5 fw-bold mt-3 mb-2">500 — Internal Server Error</h1>
        <p class="lead text-muted mb-4">An unexpected error occurred while processing your request. Our engineering team has been notified.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary-teal">
            Return to Safety
        </a>
    </div>
</div>
{% endblock %}
